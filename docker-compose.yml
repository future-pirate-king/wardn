services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wardn
      POSTGRES_PASSWORD: wardn
      POSTGRES_DB: wardn
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardn"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: ../docker/Dockerfile.server
    entrypoint: ["/usr/local/bin/wardn-server"]
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_URL: "postgres://wardn:wardn@postgres:5432/wardn?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "dev-secret-change-in-production"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  operator:
    build:
      context: ./operator
      dockerfile: ../docker/Dockerfile.operator
    entrypoint: ["wardn-operator"]
    environment:
      METRICS_BIND_ADDRESS: ":8081"
      HEALTH_PROBE_BIND_ADDRESS: ":8082"
    ports:
      - "8081:8081"
      - "8082:8082"
    depends_on:
      server:
        condition: service_healthy

  website:
    build:
      context: ./frontend
      dockerfile: apps/website/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - server

  docs:
    build:
      context: ./frontend
      dockerfile: apps/docs/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
    depends_on:
      - server

  platform:
    build:
      context: ./frontend
      dockerfile: apps/platform/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
    depends_on:
      - server

volumes:
  postgres-data:
  redis-data:
